name: Bug
description: Report incorrect or unreliable behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Seat hardware, runtime host, OS, network, emulator, and game package.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, metrics, or recordings
