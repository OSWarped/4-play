name: Feature
description: Propose a product or implementation capability
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible or operator-visible result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use measurable, testable statements.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and open questions
