[package]
name = "seat-client-native"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
control-protocol = { path = "../../shared/control-protocol" }
input-protocol = { path = "../../shared/input-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
seat-client-core = { path = "../seat-client-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
