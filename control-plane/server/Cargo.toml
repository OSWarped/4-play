[package]
name = "control-plane-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
control-protocol = { path = "../../shared/control-protocol" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
