[package]
name = "control-plane-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
control-protocol = { path = "../../shared/control-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
