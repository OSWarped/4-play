[package]
name = "runtime-host-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
control-protocol = { path = "../../shared/control-protocol" }
libc = "0.2"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = "0.8"
control-plane-server = { path = "../../control-plane/server" }
